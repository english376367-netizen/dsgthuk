<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>English 9 – Mid-term Test 1</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--pale:#eff6ff;--green:#15803d;--red:#b91c1c;--ink:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font:16px/1.55 Arial,sans-serif}
header{background:linear-gradient(120deg,#172554,#2563eb);color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:23px}header p{margin:6px 0 0;opacity:.9}
main{max-width:1100px;margin:22px auto;padding:0 14px}
.panel{background:white;border-radius:16px;padding:22px;box-shadow:0 6px 22px #0f172a12;margin-bottom:18px}
#login{max-width:440px;margin:55px auto;text-align:center}input{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;width:100%;margin:8px 0}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:white;cursor:pointer;font-weight:700}
button:disabled{cursor:not-allowed;opacity:.45}.secondary{background:#e2e8f0;color:#1e293b}.danger{background:#fee2e2;color:#991b1b}
.hidden{display:none!important}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.pill{background:#dbeafe;color:#1e40af;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700}
.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#2563eb;width:0}
.question{font-size:19px;font-weight:700;margin:14px 0}
.options{display:grid;gap:10px;margin:18px 0}.opt{width:100%;text-align:left;background:#f8fafc;color:#172033;border:1px solid #cbd5e1;padding:14px;font-weight:500}
.opt:hover:not(:disabled){background:#eff6ff;border-color:#60a5fa}.opt.correct{background:#dcfce7;border:2px solid #16a34a}.opt.wrong{background:#fee2e2;border:2px solid #dc2626}
.feedback{border-radius:12px;padding:14px;margin:14px 0;background:#f1f5f9}.feedback.good{background:#dcfce7}.feedback.bad{background:#fee2e2}
.feedback b{display:block;margin-bottom:4px}.translation{color:#334155;background:#fffbeb;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;margin-top:12px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.nav button{min-width:105px}
.reading{display:grid;grid-template-columns:1fr 1fr;gap:16px}.passage,.questionPane{height:62vh;overflow:auto;border:1px solid #dbe3ef;border-radius:12px;padding:16px;background:#fbfdff}.passage h3{margin-top:0}.questionPane{background:white}
#sectionTabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.tab{background:#e2e8f0;color:#1e293b}.tab.active{background:#1d4ed8;color:white}
textarea{width:100%;min-height:85px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
.small{color:var(--muted);font-size:13px}
@media(max-width:760px){.reading{grid-template-columns:1fr}.passage,.questionPane{height:auto;max-height:36vh}.panel{padding:16px}header h1{font-size:20px}.question{font-size:17px}}
</style></head><body>

<script>
const qs=[{"n": 7, "sec": "Phát âm", "q": "Choose the word whose underlined part is pronounced differently.", "opts": ["p<u>o</u>ttery", "contr<u>o</u>l", "f<u>o</u>ld", "l<u>o</u>cal"], "a": 0, "why": "Âm o trong pottery được phát âm /ɒ/; trong control, fold và local, phần được gạch chân phát âm /əʊ/.", "tr": "Chọn từ có phần được gạch chân được phát âm khác với các từ còn lại."}, {"n": 8, "sec": "Phát âm", "q": "Choose the word whose underlined part is pronounced differently.", "opts": ["handicraft<u>s</u>", "collection<u>s</u>", "artisan<u>s</u>", "skill<u>s</u>"], "a": 0, "why": "Đuôi -s trong handicrafts phát âm /s/ vì đứng sau âm vô thanh /t/. Trong collections, artisans và skills, đuôi -s phát âm /z/.", "tr": "Chọn từ có phần được gạch chân được phát âm khác với các từ còn lại."}, {"n": 9, "sec": "Trọng âm", "q": "Choose the word with a different primary stress pattern.", "opts": ["suburb", "delight", "helpline", "workshop"], "a": 1, "why": "delight có trọng âm ở âm tiết thứ hai; suburb, helpline và workshop có trọng âm ở âm tiết thứ nhất.", "tr": "Chọn từ có vị trí trọng âm chính khác với ba từ còn lại."}, {"n": 10, "sec": "Trọng âm", "q": "Choose the word with a different primary stress pattern.", "opts": ["handicraft", "collector", "department", "opinion"], "a": 0, "why": "handicraft có trọng âm ở âm tiết thứ nhất; collector, department và opinion có trọng âm ở âm tiết thứ hai.", "tr": "Chọn từ có vị trí trọng âm chính khác với ba từ còn lại."}, {"n": 11, "sec": "Từ vựng & ngữ pháp", "q": "This vase is a beautiful piece of _________. It’s made of clay dug from our river banks.", "opts": ["pottery", "drum", "basket", "painting"], "a": 0, "why": "pottery (đồ gốm) phù hợp vì chiếc bình được làm từ đất sét. Các lựa chọn còn lại lần lượt là trống, cái giỏ và bức tranh.", "tr": "Chiếc bình này là một sản phẩm gốm đẹp. Nó được làm từ đất sét đào ở bờ sông của chúng tôi."}, {"n": 12, "sec": "Từ vựng & ngữ pháp", "q": "_______ demonstrate exceptional skills and dedication in their craft.", "opts": ["Police officers", "Electricians", "Workers", "Artisans"], "a": 3, "why": "Artisans nghĩa là thợ thủ công/nghệ nhân, phù hợp với cụm “in their craft” (trong nghề thủ công của họ).", "tr": "Các nghệ nhân thể hiện những kỹ năng xuất sắc và sự tận tâm đối với nghề thủ công của mình."}, {"n": 13, "sec": "Từ vựng & ngữ pháp", "q": "The bustling _______ of the city offers opportunities for entertainment and employment.", "opts": ["infrastructure", "neighbourhood", "systems", "lifestyles"], "a": 1, "why": "neighbourhood (khu phố/khu dân cư) là danh từ phù hợp với ý nói về khu vực nhộn nhịp của thành phố.", "tr": "Khu phố nhộn nhịp của thành phố mang đến các cơ hội giải trí và việc làm."}, {"n": 14, "sec": "Từ vựng & ngữ pháp", "q": "The downtown area is ___________ with restaurants, shops, and entertainment venues.", "opts": ["peaceful", "bustling", "empty", "silent"], "a": 1, "why": "bustling nghĩa là nhộn nhịp, tấp nập; phù hợp với nơi có nhiều nhà hàng, cửa hàng và địa điểm giải trí.", "tr": "Khu vực trung tâm thành phố rất nhộn nhịp với các nhà hàng, cửa hàng và địa điểm giải trí."}, {"n": 15, "sec": "Từ vựng & ngữ pháp", "q": "If there’s a deadline approaching, students ________ manage their time wisely.", "opts": ["need to", "can", "must", "will"], "a": 2, "why": "must + động từ nguyên mẫu diễn tả sự cần thiết/bắt buộc. Lưu ý: phần lựa chọn trên trang và phần lời giải có sự không thống nhất về thứ tự đáp án; câu hoàn chỉnh theo lời giải là “students must manage...”, tức đáp án C trong danh sách lựa chọn đang hiển thị.", "tr": "Nếu thời hạn nộp bài đang đến gần, học sinh phải quản lý thời gian một cách khôn ngoan."}, {"n": 16, "sec": "Từ vựng & ngữ pháp", "q": "Do you know ________ to find artisans to learn how to make handmade textiles?", "opts": ["when", "where", "what", "who"], "a": 1, "why": "Cấu trúc từ để hỏi + to V. where to find = tìm ở đâu; câu hỏi đang hỏi địa điểm tìm nghệ nhân.", "tr": "Bạn có biết tìm các nghệ nhân ở đâu để học cách làm vải dệt thủ công không?"}, {"n": 17, "sec": "Từ vựng & ngữ pháp", "q": "We are _________ a project on teen pressure at the moment.", "opts": ["carrying out", "taking up", "cutting down on", "getting around"], "a": 0, "why": "carry out a project = tiến hành/thực hiện một dự án. Các cụm còn lại không phù hợp về nghĩa.", "tr": "Hiện tại chúng tôi đang tiến hành một dự án về áp lực ở tuổi thiếu niên."}, {"n": 18, "sec": "Từ vựng & ngữ pháp", "q": "Conical hat making in the village has been passed _______ from generation to generation.", "opts": ["up", "on", "down", "in"], "a": 2, "why": "pass down = truyền lại cho thế hệ sau. Cụm đúng là be passed down from generation to generation.", "tr": "Nghề làm nón lá trong làng đã được truyền từ thế hệ này sang thế hệ khác."}, {"n": 19, "sec": "Từ vựng & ngữ pháp", "q": "Many tourists wonder ________ specialty food in the Old Quarters in Ha Noi.", "opts": ["where eating", "where did they eat", "can they eat", "where to eat"], "a": 3, "why": "Dùng từ để hỏi + to V trong câu hỏi gián tiếp: where to eat = ăn ở đâu.", "tr": "Nhiều du khách băn khoăn không biết nên ăn đặc sản ở đâu trong khu phố cổ Hà Nội."}, {"n": 20, "sec": "Giao tiếp", "q": "Joan: Do you need help with carrying those groceries? — Tom: ____________", "opts": ["Never mind. Let's get it done together.", "Thanks! That would be great. I appreciate it.", "Sure, I'd be happy to help.", "Of course not. I'd be happy to help you with that."], "a": 1, "why": "Khi được đề nghị giúp đỡ, câu trả lời tự nhiên để chấp nhận là “Thanks! That would be great. I appreciate it.” Các đáp án khác không phù hợp với vai trò người nhận lời đề nghị.", "tr": "Joan: Bạn có cần giúp mang những túi đồ tạp hóa đó không? — Tom: Cảm ơn! Như vậy thì tuyệt quá. Mình rất cảm kích."}, {"n": 21, "sec": "Giao tiếp", "q": "Julle: Thank you for showing me around Van Phuc Silk Village. — Lan: ____________", "opts": ["My pleasure.", "Yes, you should say so.", "You're alright.", "That would be great."], "a": 0, "why": "My pleasure là cách đáp lại lời cảm ơn, có nghĩa là “Rất vui/Đó là niềm vui của tôi”.", "tr": "Julle: Cảm ơn bạn đã dẫn tôi tham quan Làng lụa Vạn Phúc. — Lan: Rất vui được giúp bạn."}, {"n": 22, "sec": "Điền từ – Reading", "q": "Blank (26): Few people go outside the city, and so they miss out on ______ the scenery and the fascinating history of this beautiful area.", "opts": ["questioning", "experiencing", "understanding", "welcoming"], "a": 1, "why": "miss out on + V-ing: bỏ lỡ việc gì. experiencing (trải nghiệm) kết hợp đúng với scenery (phong cảnh).", "tr": "Ít người đi ra ngoài thành phố, vì vậy họ bỏ lỡ cơ hội trải nghiệm phong cảnh và lịch sử hấp dẫn của khu vực tuyệt đẹp này."}, {"n": 23, "sec": "Điền từ – Reading", "q": "Blank (27): The beautiful village of Tatterbridge was ______ to the children's writer Jane Potter.", "opts": ["shop", "school", "home", "cottage"], "a": 2, "why": "be home to somebody = là quê hương/nơi sinh sống của ai đó.", "tr": "Ngôi làng Tatterbridge xinh đẹp là quê hương của nhà văn thiếu nhi Jane Potter."}, {"n": 24, "sec": "Điền từ – Reading", "q": "Blank (28): Jane Potter's home is now a museum and teashop, and is well ______ a visit just for its wonderful gardens.", "opts": ["known", "worth", "value", "excited"], "a": 1, "why": "Cấu trúc be well worth a visit = rất đáng để ghé thăm. “Worth” đi với danh từ/cụm danh từ.", "tr": "Ngôi nhà của Jane Potter hiện là một bảo tàng và quán trà, và rất đáng để ghé thăm chỉ vì những khu vườn tuyệt đẹp."}, {"n": 25, "sec": "Điền từ – Reading", "q": "Blank (29): ... unusual gifts made ______ hand by local artists.", "opts": ["at", "with", "in", "by"], "a": 3, "why": "Cụm cố định made by hand = được làm bằng tay/thủ công.", "tr": "... những món quà độc đáo được các nghệ nhân địa phương làm bằng tay."}, {"n": 26, "sec": "Điền từ – Reading", "q": "Blank (30): ... the Green Valley woods, which have not changed since Jane Potter ______ her stories there one hundred years ago.", "opts": ["wrote", "designed", "carved", "weaved"], "a": 0, "why": "write stories = viết truyện. Mốc thời gian one hundred years ago yêu cầu quá khứ đơn wrote.", "tr": "... khu rừng Green Valley, nơi không thay đổi kể từ khi Jane Potter viết những câu chuyện của bà ở đó một trăm năm trước."}, {"n": 27, "sec": "Đọc hiểu – Sleep", "q": "What is the role of sleep for teens?", "opts": ["It strengthens muscles.", "It reduces cravings for unhealthy foods.", "It helps with muscle growth.", "It improves academic performance."], "a": 3, "why": "Bài đọc nêu ngủ đủ giúp cải thiện chức năng nhận thức, trí nhớ và sự tập trung – những yếu tố quan trọng đối với kết quả học tập.", "tr": "Giấc ngủ có vai trò gì đối với thanh thiếu niên? — Nó cải thiện kết quả học tập."}, {"n": 28, "sec": "Đọc hiểu – Sleep", "q": "How many hours of sleep do teens require per night?", "opts": ["6–8 hours.", "4–6 hours.", "8–10 hours.", "10–12 hours."], "a": 2, "why": "Đoạn 2 nêu trực tiếp: “Teens require around 8–10 hours of sleep per night.”", "tr": "Thanh thiếu niên cần ngủ bao nhiêu giờ mỗi đêm? — 8–10 giờ."}, {"n": 29, "sec": "Đọc hiểu – Sleep", "q": "What reasons for the shortage of sleep in teens are NOT mentioned?", "opts": ["Caffeine overconsumption.", "Extracurricular activities.", "Excitement after doing sports.", "Overuse of electronic devices."], "a": 2, "why": "Bài có nhắc bài tập ở trường, hoạt động ngoại khóa, thiết bị điện tử; phần khuyến nghị còn nhắc hạn chế caffeine. Không có ý “phấn khích sau khi chơi thể thao”.", "tr": "Những lý do nào gây thiếu ngủ ở thanh thiếu niên KHÔNG được đề cập? — Sự phấn khích sau khi chơi thể thao."}, {"n": 30, "sec": "Đọc hiểu – Sleep", "q": "What does “It” in the second paragraph refer to?", "opts": ["Lack of sleep.", "The benefit of sleep.", "Consumption of caffeinated drinks.", "Electronic device use before bedtime."], "a": 0, "why": "“It” trong câu “It can also weaken the immune system...” quay lại chỉ tình trạng insufficient sleep/lack of sleep (thiếu ngủ).", "tr": "Từ “It” trong đoạn thứ hai ám chỉ điều gì? — Tình trạng thiếu ngủ."}, {"n": 31, "sec": "Đọc hiểu – Sleep", "q": "What are teens necessary to do to sleep well at night?", "opts": ["Drink coffee before going to bed.", "Use smartphones a lot before going to bed.", "Make a sleep environment friendly.", "Go to bed at different time."], "a": 2, "why": "Bài đọc khuyên tạo một môi trường thân thiện với giấc ngủ (create a sleep-friendly environment), đồng thời giữ lịch ngủ ổn định và hạn chế caffeine/thiết bị điện tử trước giờ ngủ.", "tr": "Thanh thiếu niên cần làm gì để ngủ ngon vào ban đêm? — Tạo một môi trường thuận lợi cho giấc ngủ."}];
const written=[{"n": 36, "sec": "Viết lại câu", "type": "text", "q": "busier / my schedule / get, / harder / it / become / find time / relaxation.", "answer": "The busier my schedule gets, the harder it becomes to find time for relaxation.", "accepted": ["the busier my schedule gets the harder it becomes to find time for relaxation"], "why": "Cấu trúc so sánh kép: The + comparative + S + V, the + comparative + S + V. “busy” → “busier”; “hard” → “harder”.", "tr": "Lịch trình của tôi càng bận rộn thì tôi càng khó tìm được thời gian để thư giãn."}, {"n": 37, "sec": "Viết lại câu", "type": "text", "q": "our family, / baking secrets / typically / pass down / one generation / next.", "answer": "In our family, baking secrets are typically passed down from one generation to the next.", "accepted": ["in our family baking secrets are typically passed down from one generation to the next"], "why": "Câu bị động hiện tại đơn: S + am/is/are + V3/ed. “Baking secrets” là chủ ngữ số nhiều nên dùng are passed down.", "tr": "Trong gia đình chúng tôi, các bí quyết làm bánh thường được truyền từ thế hệ này sang thế hệ tiếp theo."}, {"n": 38, "sec": "Viết lại câu", "type": "text", "q": "Cut down / screen time / bedtime / improve / quality / your sleep.", "answer": "Cutting down on screen time before bedtime improves / can improve the quality of your sleep.", "accepted": ["cutting down on screen time before bedtime improves the quality of your sleep", "cutting down on screen time before bedtime can improve the quality of your sleep"], "why": "Đưa cụm động từ lên đầu câu làm chủ ngữ nên dùng V-ing: Cutting down on...; cut down on = cắt giảm. Có thể dùng improves hoặc can improve.", "tr": "Cắt giảm thời gian sử dụng màn hình trước khi đi ngủ giúp cải thiện chất lượng giấc ngủ của bạn."}, {"n": 39, "sec": "Từ gợi ý – theo mẫu", "type": "text", "q": "Do you know the locations to buy traditional handicrafts? (WHERE)<br><br>Do you know ______ traditional handicrafts?", "answer": "where to buy", "accepted": ["where to buy"], "why": "Dùng từ để hỏi + to V trong câu hỏi gián tiếp: where to buy = mua ở đâu. Không đổi từ WHERE và không quá 5 từ.", "tr": "Bạn có biết những địa điểm để mua đồ thủ công truyền thống không? → Bạn có biết mua đồ thủ công truyền thống ở đâu không?"}, {"n": 40, "sec": "Từ gợi ý – theo mẫu", "type": "text", "q": "The local weavers typically hand down their weaving techniques to their eldest daughters. (PASS)<br><br>The local weavers have a tradition ______ their weaving techniques to their eldest daughters.", "answer": "of passing down", "accepted": ["of passing down"], "why": "Cấu trúc have a tradition of + V-ing: có truyền thống làm gì. pass down = truyền lại; sau giới từ of dùng V-ing.", "tr": "Những người thợ dệt địa phương thường truyền lại kỹ thuật dệt của họ cho các con gái cả. → Những người thợ dệt địa phương có truyền thống truyền lại kỹ thuật dệt cho các con gái cả."}];
const passages={"Điền từ – Reading": ["Many visitors come to Tatterbridge to see the wonderful art galleries and museums, the beautiful buildings and the fantastic parks. Few people go outside the city, and so they miss out on (26) ______ the scenery and the fascinating history of this beautiful area. This brochure will tell you what you can see if you take a short bus ride out of the city.<br><br>The beautiful village of Tatterbridge was (27) ______ to the children's writer Jane Potter, whose stories of Benjamin Bear are loved by adults and children around the world. Jane Potter's home is now a museum and teashop, and is well (28) ______ a visit just for its wonderful gardens. It also has a gift shop where you can buy souvenirs and books.<br><br>Tatterbridge has a number of interesting shops including an excellent cake shop, and Wendy's Gift shop, where you can find lots of unusual gifts made (29) ______ hand by local artists. Lovers of Jane Potter's books should also walk to the Green Valley woods, which have not changed since Jane Potter (30) ______ her stories there one hundred years ago.", "Nhiều du khách đến Tatterbridge để tham quan các phòng trưng bày nghệ thuật và bảo tàng tuyệt vời, những tòa nhà đẹp và các công viên tuyệt vời. Ít người đi ra ngoài thành phố, vì vậy họ bỏ lỡ cơ hội trải nghiệm phong cảnh và lịch sử hấp dẫn của khu vực xinh đẹp này. Tờ giới thiệu này sẽ cho bạn biết những gì bạn có thể nhìn thấy nếu đi xe buýt một chuyến ngắn ra khỏi thành phố.<br><br>Ngôi làng Tatterbridge xinh đẹp là quê hương của nhà văn thiếu nhi Jane Potter, người có những câu chuyện về Benjamin Bear được cả người lớn và trẻ em trên khắp thế giới yêu thích. Nhà của Jane Potter hiện là bảo tàng và quán trà, và rất đáng ghé thăm chỉ vì những khu vườn tuyệt đẹp. Nơi đây cũng có một cửa hàng quà tặng, nơi bạn có thể mua quà lưu niệm và sách.<br><br>Tatterbridge có một số cửa hàng thú vị, bao gồm một tiệm bánh tuyệt vời và cửa hàng quà tặng Wendy, nơi bạn có thể tìm thấy nhiều món quà độc đáo do các nghệ nhân địa phương làm thủ công. Những người yêu thích sách của Jane Potter cũng nên đi bộ đến khu rừng Green Valley, nơi không thay đổi kể từ khi Jane Potter viết truyện ở đó cách đây một trăm năm."], "Đọc hiểu – Sleep": ["<b>How important is sleep for teens?</b><br><br>Sleep plays an important part in teens' overall health and well-being. During sleep, the body undergoes essential processes, such as growth, repair, and restoration. Adequate sleep has been linked to improved cognitive function, memory, and concentration, which are vital for academic performance. It also boosts mood and emotional well-being, reducing the risk of mental health issues, such as depression and anxiety.<br><br>Teens require around 8–10 hours of sleep per night, but many often fall short due to various factors like schoolwork, extracurricular activities, and electronic devices. Lack of sleep can have negative effects on teens, leading to decreased attention span, poor decision-making, and an increased risk of accidents. Moreover, insufficient sleep has been associated with obesity, as it disrupts hormone regulation and increases cravings for unhealthy foods. It can also weaken the immune system, making teens more susceptible to illnesses.<br><br>To ensure a good night's sleep, teens should establish a consistent sleep schedule, create a sleep-friendly environment, limit caffeine and electronic device use before bedtime, and engage in relaxation techniques. Parents and educators play a crucial role in promoting healthy sleep habits and raising awareness of the importance of sleep for teens' overall well-being.", "<b>Giấc ngủ quan trọng như thế nào đối với thanh thiếu niên?</b><br><br>Giấc ngủ đóng vai trò quan trọng đối với sức khỏe và trạng thái khỏe mạnh tổng thể của thanh thiếu niên. Trong khi ngủ, cơ thể trải qua những quá trình thiết yếu như phát triển, sửa chữa và phục hồi. Ngủ đủ giấc có liên quan đến việc cải thiện chức năng nhận thức, trí nhớ và khả năng tập trung – những yếu tố rất quan trọng đối với kết quả học tập. Giấc ngủ cũng cải thiện tâm trạng và sức khỏe cảm xúc, giảm nguy cơ mắc các vấn đề sức khỏe tâm thần như trầm cảm và lo âu.<br><br>Thanh thiếu niên cần ngủ khoảng 8–10 giờ mỗi đêm, nhưng nhiều em thường ngủ không đủ vì nhiều yếu tố như bài tập ở trường, hoạt động ngoại khóa và các thiết bị điện tử. Thiếu ngủ có thể gây ra những ảnh hưởng tiêu cực, khiến khả năng chú ý giảm sút, khả năng đưa ra quyết định kém và nguy cơ tai nạn tăng lên. Hơn nữa, thiếu ngủ có liên quan đến béo phì vì nó làm rối loạn việc điều hòa hormone và làm tăng cảm giác thèm những thực phẩm không lành mạnh. Tình trạng này cũng có thể làm suy yếu hệ miễn dịch, khiến thanh thiếu niên dễ mắc bệnh hơn.<br><br>Để có một giấc ngủ ngon, thanh thiếu niên nên duy trì lịch ngủ đều đặn, tạo môi trường thuận lợi cho giấc ngủ, hạn chế caffeine và việc sử dụng thiết bị điện tử trước giờ đi ngủ, đồng thời thực hiện các phương pháp thư giãn. Cha mẹ và giáo viên đóng vai trò quan trọng trong việc thúc đẩy thói quen ngủ lành mạnh và nâng cao nhận thức về tầm quan trọng của giấc ngủ đối với sức khỏe tổng thể của thanh thiếu niên."]};
const all=[...qs,...written];
const sections=[...new Set(all.map(x=>x.sec))];
let idx=0,answers={},score=0;
function login(){if(document.getElementById('pass').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else document.getElementById('loginErr').textContent='Mật khẩu chưa đúng. Vui lòng thử lại.'}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;")}
function sectionQs(sec){return all.filter(q=>q.sec===sec)}
function renderTabs(){let el=document.getElementById('sectionTabs');el.innerHTML='';sections.forEach(s=>{let wrap=document.createElement('span');wrap.style.display='inline-flex';wrap.style.gap='4px';let b=document.createElement('button');b.className='tab'+(all[idx].sec===s?' active':'');b.textContent=s+' · '+sectionQs(s).length;b.onclick=()=>{idx=all.findIndex(q=>q.sec===s);render()};let r=document.createElement('button');r.className='danger';r.textContent='↻';r.title='Reset riêng phần '+s;r.onclick=()=>resetSection(s);wrap.append(b,r);el.appendChild(wrap)})}
function render(){let q=all[idx],a=answers[q.n];document.getElementById('count').textContent=`Câu ${idx+1}/${all.length} • ${q.sec}`;document.getElementById('score').textContent=`Điểm: ${score}/${all.length}`;document.getElementById('bar').style.width=((idx+1)/all.length*100)+'%';renderTabs();
let isRead=!!passages[q.sec];let body='';
if(isRead){let p=passages[q.sec];body=`<div class="reading"><div class="passage"><h3>Bài đọc</h3>${p[0]}<hr><h3>Bản dịch tiếng Việt</h3>${p[1]}</div><div class="questionPane"><div class="small">${q.sec} • Câu ${q.n}</div><div class="question">${q.q}</div>${renderAnswer(q,a)}</div></div>`}
else body=`<div class="small">${q.sec} • Câu ${q.n}</div><div class="question">${q.q}</div>${renderAnswer(q,a)}`;
document.getElementById('workArea').innerHTML=body+`<div class="nav"><button class="secondary" ${idx===0?'disabled':''} onclick="move(-1)">← Câu trước</button><button ${idx===all.length-1?'disabled':''} onclick="move(1)">Câu tiếp →</button></div>`;
}
function renderAnswer(q,a){if(q.type==='text'){return `<textarea id="typed" placeholder="Nhập câu trả lời..." ${a?'disabled':''}>${a?esc(a.value):''}</textarea>${a?feedback(q,a):`<button onclick="submitText(${q.n})">Nộp câu trả lời</button>`}`}
let s=`<div class="options">`;q.opts.forEach((o,i)=>{let cl='opt';if(a&&i===q.a)cl+=' correct';if(a&&i===a.value&&i!==q.a)cl+=' wrong';s+=`<button class="${cl}" ${a?'disabled':''} onclick="choose(${q.n},${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`});s+='</div>';if(a)s+=feedback(q,a);return s}
function feedback(q,a){let good=q.type==='text'?a.good:a.value===q.a;let ans=q.type==='text'?q.answer:`${'ABCD'[q.a]}. ${q.opts[q.a]}`;return `<div class="feedback ${good?'good':'bad'}"><b>${good?'✓ Chính xác!':'✗ Chưa chính xác.'}</b><div>Đáp án đúng: <strong>${ans}</strong></div><div style="margin-top:8px">${q.why}</div><div class="translation"><b>Nghĩa tiếng Việt:</b> ${q.tr}</div></div>`}
function choose(n,v){if(answers[n])return;let q=all.find(x=>x.n===n);answers[n]={value:v};if(v===q.a)score++;render()}
function submitText(n){if(answers[n])return;let q=all.find(x=>x.n===n),v=document.getElementById('typed').value.trim(),norm=x=>x.toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();if(!v){alert('Vui lòng nhập câu trả lời.');return}let good=q.accepted.includes(norm(v));answers[n]={value:v,good};if(good)score++;render()}
function move(d){idx=Math.max(0,Math.min(all.length-1,idx+d));render()}
function resetSection(sec){if(!confirm('Bạn có chắc muốn làm lại toàn bộ phần '+sec+'? Điểm phần này sẽ được tính lại.'))return;sectionQs(sec).forEach(q=>delete answers[q.n]);score=all.reduce((s,q)=>s+(answers[q.n]&&(q.type==='text'?answers[q.n].good:answers[q.n].value===q.a)?1:0),0);render()}
</script></body></html>
